<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🌾 Crop Recommendation System 🌾</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(to right, #e6ffe6, #f5fff5);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            width: 900px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 30px;
            font-weight: 700;
        }
        label.form-label {
            font-weight: 600;
            color: #1b5e20;
            margin-bottom: 6px;
            display: block;
        }
        input.form-control {
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
            width: 100%;
        }
        button:hover {
            background-color: #43a047;
        }
        .result-box {
            margin-top: 25px;
            background: #e8f5e9;
            border-left: 6px solid #2e7d32;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.3em;
            font-weight: bold;
            color: #1b5e20;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🌾 Crop Recommendation System 🌾</h1>

    <form action="/predict" method="post">
        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Nitrogen (N)</label>
                <input type="number" step="any" name="N" class="form-control" value="{{ N or '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Phosphorus (P)</label>
                <input type="number" step="any" name="P" class="form-control" value="{{ P or '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Potassium (K)</label>
                <input type="number" step="any" name="K" class="form-control" value="{{ K or '' }}" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">Temperature (°C)</label>
                <input type="number" step="any" name="temperature" class="form-control" value="{{ temperature or '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Humidity (%)</label>
                <input type="number" step="any" name="humidity" class="form-control" value="{{ humidity or '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">pH</label>
                <input type="number" step="any" name="ph" class="form-control" value="{{ ph or '' }}" required>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-4">
                <label class="form-label">Rainfall (mm)</label>
                <input type="number" step="any" name="rainfall" class="form-control" value="{{ rainfall or '' }}" required>
            </div>
        </div>

        <button type="submit">🌱 Recommend Crop</button>
    </form>

    {% if crop %}
        <div class="result-box">
            🌿 Recommended Crop: <b>{{ crop }}</b>
        </div>
    {% endif %}
</div>

</body>
</html>
